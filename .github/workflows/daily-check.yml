name: Daily Microsoft Voucher Check

on:
  schedule:
    # 9:15 AM India time = 3:45 AM UTC
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voucher-monitor
  cancel-in-progress: false

jobs:
  check-vouchers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run voucher checker
        run: python voucher_agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save report, history, and source registry
        run: |
          git config user.name "voucher-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json daily_report.md source_registry.json
          if ! git diff --cached --quiet; then
            git commit -m "Update voucher report and source registry"
            git push
          fi
